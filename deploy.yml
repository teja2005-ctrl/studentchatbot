name: Deploy EduBot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Validate ────────────────────────────────────────────
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html not found!"
            exit 1
          fi
          echo "✅ index.html found ($(wc -c < index.html) bytes)"

      - name: Check for accidental API key commits
        run: |
          if grep -r "sk-ant-api" . --include="*.html" --include="*.js" 2>/dev/null; then
            echo "❌ SECURITY: Anthropic API key found in source files!"
            exit 1
          fi
          echo "✅ No API keys found in source files"

  # ── Deploy to GitHub Pages ───────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
